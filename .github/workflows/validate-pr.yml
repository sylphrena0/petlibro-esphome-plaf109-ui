name: Validate PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Lint PR title
        id: lint_pr_title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on invalid PR title
        if: always() && steps.lint_pr_title.outputs.error_message != null
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-title-lint-error
          message: |
            We require pull request titles to follow the [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) format (e.g. `fix: keep meal time while editing`, `feat(ui): add chime button`, `docs: update screenshots`).

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      - name: Delete resolved title comment
        if: steps.lint_pr_title.outputs.error_message == null
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-title-lint-error
          delete: true
