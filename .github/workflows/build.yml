name: Build

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            build/app.js
            build/style.css
          if-no-files-found: error
